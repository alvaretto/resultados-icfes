# Despertador de la app en Streamlit Community Cloud.
#
# Streamlit duerme toda app sin trafico durante 12 h y el despertar es MANUAL
# (hay que hacer clic en "Yes, get this app back up!"). Por eso esto NO es un ping:
# abre un navegador real, hace el clic si hace falta y comprueba que la app quedo viva.
#
# La version anterior hacia `curl` cada 6 h y aceptaba cualquier codigo HTTP como exito:
# dio "success" 243 veces mientras la app dormia, porque / responde 303 y /healthz
# responde 200 {"status":"ok"} este viva o dormida.
#
# Cadencia de 3 h = 4 oportunidades dentro de cada ventana de 12 h, margen suficiente
# para las corridas que GitHub retrasa o descarta bajo carga.

name: Keep Streamlit alive

on:
  schedule:
    - cron: '17 */3 * * *'   # 00:17, 03:17, 06:17... UTC (minuto 17: evita el pico del minuto 0)
  workflow_dispatch:
    inputs:
      app_url:
        description: 'URL a verificar (solo para probar la alerta; en blanco = la app real)'
        required: false
        default: ''

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar Playwright + Chromium
        working-directory: .github/scripts
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Despertar la app y verificar que quedo viva
        working-directory: .github/scripts
        env:
          APP_URL: ${{ inputs.app_url || 'https://resultados-icfes-pcielo-2025.streamlit.app/' }}
        run: node keep-alive.mjs
        # Si la app no queda VIVA, este paso falla: GitHub envia correo al dueno del repo.

      - name: Avisar por Telegram (bot de Hermes) si la app no quedo viva
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "::warning::Faltan los secretos de Telegram; no se envia alerta."
            exit 0
          fi
          TEXTO="[Panel ICFES] La app quedo DORMIDA
          El despertador corrio pero no logro dejarla viva.
          Panel: https://resultados-icfes-pcielo-2025.streamlit.app/
          Corrida: $CORRIDA
          Si se repite, revisa los logs en https://share.streamlit.io/"
          curl -sS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT" --data-urlencode text="$TEXTO" \
            -o /dev/null -w "telegram sendMessage: %{http_code}\n"
