name: Keep Streamlit alive

on:
  schedule:
    # Cada 6 horas: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecucion manual desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          # Streamlit Cloud responde con 303 redirect - eso es normal y suficiente
          # para despertar la app. Aceptamos cualquier respuesta HTTP como exito.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            https://resultados-icfes-pcielo-2025.streamlit.app/)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -eq 000 ]; then
            echo "No response - app may be completely down"
            exit 1
          fi
          echo "App responded - keep alive successful"
